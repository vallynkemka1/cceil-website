<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#E8F0F5"/>

  <!-- Shoulders / blazer -->
  <ellipse cx="100" cy="185" rx="70" ry="45" fill="#1B4D8C"/>
  <ellipse cx="100" cy="172" rx="50" ry="34" fill="#2D6FB0"/>

  <!-- Neck -->
  <rect x="86" y="130" width="28" height="22" rx="4" fill="#8B5A2B"/>

  <!-- Head (squarer jaw for masculine look) -->
  <path d="M64 105
           C64 80 78 62 100 62
           C122 62 136 80 136 105
           C136 122 130 138 118 148
           L82 148
           C70 138 64 122 64 105 Z" fill="#9A6633"/>

  <!-- Afro hair -->
  <circle cx="100" cy="74" r="46" fill="#1a0a00"/>
  <circle cx="63" cy="90" r="19" fill="#1a0a00"/>
  <circle cx="137" cy="90" r="19" fill="#1a0a00"/>
  <circle cx="78" cy="54" r="17" fill="#1a0a00"/>
  <circle cx="122" cy="54" r="17" fill="#1a0a00"/>
  <circle cx="100" cy="46" r="19" fill="#1a0a00"/>

  <!-- Face (reveal beneath afro) -->
  <path d="M66 108
           C66 84 80 66 100 66
           C120 66 134 84 134 108
           C134 124 128 139 117 148
           L83 148
           C72 139 66 124 66 108 Z" fill="#9A6633"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="106" rx="7" ry="5" fill="#fff"/>
  <ellipse cx="115" cy="106" rx="7" ry="5" fill="#fff"/>
  <circle cx="86" cy="106" r="4" fill="#2a1200"/>
  <circle cx="116" cy="106" r="4" fill="#2a1200"/>
  <circle cx="87.5" cy="104.5" r="1.2" fill="#fff"/>
  <circle cx="117.5" cy="104.5" r="1.2" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M77 97 Q85 92 93 96" stroke="#1a0a00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M107 96 Q115 92 123 97" stroke="#1a0a00" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M97 112 Q100 122 103 112" stroke="#6b3f1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="93" cy="120" rx="4" ry="2.5" fill="#6b3f1a" opacity="0.4"/>
  <ellipse cx="107" cy="120" rx="4" ry="2.5" fill="#6b3f1a" opacity="0.4"/>

  <!-- Beard -->
  <path d="M66 110 Q64 138 100 146 Q136 138 134 110
           Q135 132 122 142 Q112 147 100 147 Q88 147 78 142
           Q65 132 66 110 Z" fill="#1a0a00"/>
  <!-- Mustache -->
  <path d="M85 122 Q100 130 115 122 Q100 128 85 122 Z" fill="#1a0a00"/>

  <!-- Mouth -->
  <path d="M90 131 Q100 136 110 131" stroke="#5a2a0a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Collar detail -->
  <path d="M76 152 L100 165 L124 152" stroke="#fff" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
